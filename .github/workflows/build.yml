
name: TinaMusic Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build TinaMusic Docker image
        run: |
          docker build --pull -t tinamusic:ci .

      - name: Confirm build completed
        run: |
          echo "TinaMusic Docker image built successfully."
          docker image inspect tinamusic:ci
